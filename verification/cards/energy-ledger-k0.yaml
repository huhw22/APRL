units: {length: micrometer, time: femtosecond}
runtime: {mode: throughput, resource_monitor: {enabled: false}}
output: {overwrite: true, manifest: run-manifest.yaml}
mesh:
  field_solver: cowan-z
  cells: [12, 12, 96]
  cell_size: [0.5, 0.5, 0.1]
  center: [0.0, 0.0, 0.0]
  duration: 8.0
  boost_gamma: 2.0
  particle_steps_per_undulator_period: 1
boundary: {type: pec}
initial_self_field: {enabled: false}
beam:
  reference: {initial_center_z: -0.5}
  input:
    type: generated-gaussian
    electrons: 2.0
    macroparticles: 2
    gamma: 4.0
    direction: [0.0, 0.0, 1.0]
    center: [0.0, 0.0, 0.0]
    sigma_position: [0.0, 0.0, 0.0]
    sigma_proper_velocity: [0.0, 0.0, 0.0]
    random_seed: 16
sources:
  incident_waves: []
  magnetic_elements:
    - type: planar-undulator
      strength_parameter: 0.0
      period: 1.0
      periods: 1
      entrance_z: 0.0
      polarization_angle_rad: 0.0
      gaussian_fringe: false
stop: {mode: after-last-element}
trajectory: {enabled: false}
energy_ledger:
  enabled: true
  directory: ledger
  filename: energy-ledger.h5
  sample_interval_steps: 1
  buffer_records: 8
  compression: 0
  warning_relative_tolerance: 1.0e-8
