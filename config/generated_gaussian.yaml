# Deterministic Gaussian beam for smoke tests; do not use it as a production
# beam-preparation replacement.
units:
  length: micrometer
  time: picosecond

# Small-server test path: Ctrl-C/SIGTERM closes readable partial outputs.
runtime:
  mode: interactive
  stop_check_interval_steps: 16

mesh:
  # z-priority Cowan/CKC stencil; use yee only for regression runs.
  field_solver: cowan-z
  lengths: [40.0, 40.0, 12.0]
  resolution: [1.0, 1.0, 0.2]
  center: [0.0, 0.0, 0.0]
  duration: 0.01
  boost_gamma: 2.0
  particle_steps_per_undulator_period: 32

beam:
  reference:
    initial_center_z: -1.8
  input:
    type: generated-gaussian
    electrons: 8.0
    macroparticles: 8
    gamma: 4.0
    direction: [0.0, 0.0, 1.0]
    center: [0.0, 0.0, 0.025]
    sigma_position: [0.02, 0.02, 0.01]
    sigma_proper_velocity: [0.0, 0.0, 0.0]
    random_seed: 17

sources:
  incident_waves: []
  magnetic_elements:
    - type: planar-undulator
      strength_parameter: 0.1
      period: 1.0
      periods: 1
      entrance_z: 0.0
      polarization_angle_rad: 0.0
      gaussian_fringe: true
      fringe_relative_cutoff: 1.0e-9

stop:
  mode: reference-center-z
  z: 2.5

trajectory:
  enabled: true
  directory: output/generated-gaussian
  basename: particles
  rhythm: 0.002
  buffer_records: 64
  flush_every_samples: 1
  compression: 0
