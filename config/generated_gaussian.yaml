# Deterministic Gaussian beam for smoke tests; do not use it as a production
# beam-preparation replacement.
units:
  length: micrometer
  time: picosecond

# Small-server test path: Ctrl-C/SIGTERM closes readable partial outputs.
runtime:
  mode: interactive
  stop_check_interval_steps: 16
  resource_monitor:
    enabled: true
    progress_interval_steps: 16
    calibration_steps: 1
    memory_safety_factor: 1.25
    time_safety_factor: 1.25

mesh:
  # z-priority Cowan/CKC stencil; use yee only for regression runs.
  field_solver: cowan-z
  cells: [40, 40, 60]
  cell_size: [1.0, 1.0, 0.2]
  center: [0.0, 0.0, 0.0]
  duration: 0.01
  boost_gamma: 2.0
  # Smoke-test minimum only; production high-harmonic cards need much more.
  particle_steps_per_undulator_period: 1
  maximum_particle_substeps: 4096

boundary:
  type: cpml
  cells: [8, 8, 8]
  polynomial_order: 3.0
  target_reflection: 1.0e-8
  kappa_max: 8.0
  alpha_fraction: 0.0

initial_self_field:
  enabled: true
  relative_tolerance: 1.0e-10
  maximum_iterations: 10000

beam:
  reference:
    initial_center_z: -1.8
  input:
    type: generated-gaussian
    electrons: 8.0
    macroparticles: 8
    gamma: 4.0
    direction: [0.0, 0.0, 1.0]
    center: [0.0, 0.0, 0.025]
    sigma_position: [0.02, 0.02, 0.01]
    sigma_proper_velocity: [0.0, 0.0, 0.0]
    random_seed: 17

sources:
  incident_waves: []
  magnetic_elements:
    - type: planar-undulator
      characteristic: true
      strength_parameter: 0.1
      period: 1.0
      periods: 1
      entrance_z: 0.0
      polarization_angle_rad: 0.0
      gaussian_fringe: true
      fringe_relative_cutoff: 1.0e-9

stop:
  mode: reference-center-z
  z: 2.5

trajectory:
  enabled: true
  directory: output/generated-gaussian
  basename: particles
  rhythm: 0.002
  buffer_records: 64
  flush_every_samples: 1
  compression: 0

# Optional global particle/field conservation audit. Disabled means no
# boundary-power loop, MPI reduction, HDF5 buffer, or file.
energy_ledger:
  enabled: false
  directory: output/generated-gaussian
  filename: energy-ledger.h5
  sample_interval_steps: 2
  buffer_records: 64
  compression: 0
  warning_relative_tolerance: 0.01
