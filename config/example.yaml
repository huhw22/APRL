# HDF5 production-input example. Lengths and times below use the global units;
# the particle HDF5 file itself always stores positions in SI metres.
units:
  length: micrometer
  time: picosecond

# Supercomputer path: no signal polling and no periodic durability flushes.
runtime:
  mode: throughput

mesh:
  # z-priority Cowan/CKC stencil; use yee only for regression runs.
  field_solver: cowan-z
  lengths: [40.0, 40.0, 12.0]
  resolution: [1.0, 1.0, 0.2]
  center: [0.0, 0.0, 0.0]
  duration: 0.01
  boost_gamma: 2.0
  particle_steps_per_undulator_period: 32

boundary:
  type: cpml
  cells: [8, 8, 8]
  polynomial_order: 3.0
  target_reflection: 1.0e-8
  kappa_max: 8.0
  alpha_fraction: 0.0

beam:
  reference:
    # The first physical element entrance is lab z=0; the bunch starts left.
    initial_center_z: -1.8
  input:
    type: hdf5
    file: ../examples/particles/example_particles.h5
    electrons: 4.0
    position_offset: [0.0, 0.0, 0.0]

sources:
  incident_waves: []
  magnetic_elements:
    - type: planar-undulator
      characteristic: true
      strength_parameter: 0.1
      period: 1.0
      periods: 1
      entrance_z: 0.0
      polarization_angle_rad: 0.0
      gaussian_fringe: true
      fringe_relative_cutoff: 1.0e-9

# Both planes are zero-length laboratory-frame beamline elements.  Omit this
# block (or set enabled: false) to allocate no detector buffers or file handles.
detectors:
  enabled: true
  directory: output/example/detectors
  field_planes:
    - name: exit-fields
      z: 2.5
      rhythm: 0.002
      buffer_samples: 2
      compression: 0
      # This deliberately tiny I/O smoke-test box has no room for the
      # gamma*rho free-drift reference region. Production radiation cards
      # should enable this block and place the detector farther downstream.
      particle_background:
        enabled: false
        buffer_records: 16384
        compression: 0
        validation:
          enabled: false
          maximum_particles: 100000
  particle_planes:
    - name: exit-particles
      z: 2.5
      buffer_records: 4096
      compression: 0

stop:
  mode: after-last-element

trajectory:
  # Full histories are a small-particle/debug path, not a production default.
  enabled: false
  directory: output/example
  basename: particles
  rhythm: 0.002
  buffer_records: 64
  flush_every_samples: 1
  compression: 0
