# APRL 2.0 minimal moving-window bending example (not a convergence card).
# Generate particles.h5 in the same directory; see README quick start.
units: {length: micrometer, time: femtosecond}
runtime: {mode: throughput, resource_monitor: {enabled: false}}
output: {overwrite: false, manifest: output/example/run-manifest.yaml}
mesh:
  particle_coupling: conservative-source
  longitudinal_shape: linear-binomial3
  self_field_feedback: true
  field_solver: cowan-z
  current_filter: none
  cells: [40, 40, 256]
  cell_size: [5, 5, 1]
  center: [0, 0, 0]
  duration: 100
  boost_gamma: 2
  particle_steps_per_undulator_period: 32
  maximum_particle_substeps: 4096
  moving_window:
    enabled: true
    cells: 96
    lower_guard_cells: 8
    upper_guard_cells: 16
    block_layers: 16
    reference_directory: "output/example/reference"
    reference_surface_current: true
    inlet_charge_match: true
boundary:
  type: cpml
  cells: [4, 4, 0]
  polynomial_order: 3
  target_reflection: 1.0e-8
  kappa_max: 8
  alpha_fraction: 0
initial_self_field:
  enabled: true
  model: cowan-relativistic-poisson
  maximum_mean_transverse_beta: 0.01
beam:
  reference:
    input_plane_z: 0
    initial_center_z: 0.2
    frozen_lab_plane_injection: true
    hold_transverse_until_activation: true
    activation_plane_z: 0
  input:
    type: hdf5
    file: "particles.h5"
    electrons: 21
    position_offset: [0, 0, 0]
sources:
  incident_waves: []
  magnetic_elements:
    - {type: uniform-dipole, entrance_z: 0.5, length: 1, field_T: 0.1,
       polarization_angle_rad: 0}
detectors:
  enabled: true
  directory: output/example/detectors
  field_planes:
    - {name: field, z: 5, rhythm: 0.1, buffer_samples: 4, compression: 0}
  particle_planes:
    - {name: particles, z: 5, buffer_records: 32, compression: 0}
stop: {mode: reference-center-z, z: 10}
trajectory: {enabled: false}
energy_ledger:
  enabled: true
  directory: output/example/ledger
  filename: energy-ledger.h5
  sample_interval_steps: 1
  buffer_records: 4
  compression: 0
  warning_relative_tolerance: 1.0e-6
